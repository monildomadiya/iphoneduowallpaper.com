# Install only after issuing the certificate referenced below.
# Keep this as a separate virtual host; preserve other sites on the VPS.
server {
    listen 80;
    server_name iphoneduowallpaper.com www.iphoneduowallpaper.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://iphoneduowallpaper.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.iphoneduowallpaper.com;
    ssl_certificate /etc/letsencrypt/live/iphoneduowallpaper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iphoneduowallpaper.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://iphoneduowallpaper.com$request_uri;
}

server {
    listen 443 ssl;
    server_name iphoneduowallpaper.com;
    ssl_certificate /etc/letsencrypt/live/iphoneduowallpaper.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iphoneduowallpaper.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
