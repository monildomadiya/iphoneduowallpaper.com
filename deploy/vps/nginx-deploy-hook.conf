# Included inside the iphoneduowallpaper.com HTTPS server block (see README, "Automatic deployment").
# Needs, at http level (e.g. /etc/nginx/conf.d/iphoneduowallpaper-deploy.conf):
#   limit_req_zone $binary_remote_addr zone=iphoneduowallpaper_deploy:1m rate=6r/m;

location = /__deploy {
    limit_except POST { deny all; }
    limit_req zone=iphoneduowallpaper_deploy burst=2 nodelay;
    proxy_pass http://127.0.0.1:9187;
    proxy_http_version 1.0;
    proxy_read_timeout 15s;
}

# The live and last failed commit hashes, which GitHub Actions polls. Both are public information.
location = /__deploy/live {
    alias /srv/iphoneduowallpaper/deployed-commit;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
}

location = /__deploy/failed {
    alias /srv/iphoneduowallpaper/failed-commit;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
}
