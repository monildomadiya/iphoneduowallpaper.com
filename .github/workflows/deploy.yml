name: Deploy to VPS

# Every push to main asks the server to release it. The server pulls the public repository itself,
# so this workflow holds no secrets: it rings the server's deploy hook and waits for the result.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push supersedes an older run that is still waiting; the server always releases main.
concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://iphoneduowallpaper.com
    env:
      SITE: iphoneduowallpaper.com
      # Talk to the VPS directly, not through Cloudflare's proxy.
      ORIGIN: ${{ vars.VPS_HOST || '107.172.39.165' }}
    steps:
      - name: Ask the server to release main
        run: curl -fsS --retry 3 --max-time 20 --resolve "$SITE:443:$ORIGIN" -X POST "https://$SITE/__deploy"

      - name: Wait for this commit to go live
        run: |
          origin() { curl -fsS --max-time 10 --resolve "$SITE:443:$ORIGIN" "https://$SITE$1" 2>/dev/null || true; }
          for attempt in $(seq 1 180); do
            if [ "$(origin /__deploy/live)" = "$GITHUB_SHA" ]; then
              echo "Live: $GITHUB_SHA"
              exit 0
            fi
            if [ "$(origin /__deploy/failed)" = "$GITHUB_SHA" ]; then
              echo "::error::The server could not release $GITHUB_SHA; the previous release is still live. On the VPS: journalctl -u iphoneduowallpaper-deploy -n 100"
              exit 1
            fi
            sleep 10
          done
          echo "::error::$GITHUB_SHA was not live after 30 minutes. On the VPS: journalctl -u iphoneduowallpaper-deploy -n 100"
          exit 1

      - name: Check the public site
        run: curl -fsS --retry 5 --retry-delay 5 --max-time 10 "https://$SITE/api/health"
