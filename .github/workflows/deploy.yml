name: Deploy to VPS

# Every push to main releases the site right away. The SSH key in VPS_SSH_KEY is locked on the
# server to a single forced command that runs the deployer, so this workflow can't run anything else.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://iphoneduowallpaper.com
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          HOST: ${{ vars.VPS_HOST || '107.172.39.165' }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST_KEY" ]; then
            echo "::error::Add the VPS_SSH_KEY and VPS_HOST_KEY repository secrets (see deploy/vps/README.md)."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the server's own host key instead of trusting whatever answers on first connect.
          printf '%s %s\n' "$HOST" "$HOST_KEY" > ~/.ssh/known_hosts

      - name: Build and release on the server
        env:
          HOST: ${{ vars.VPS_HOST || '107.172.39.165' }}
          PORT: ${{ vars.VPS_SSH_PORT || '22' }}
        run: ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "root@$HOST" "$GITHUB_SHA"

      - name: Check the live site
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsS --max-time 10 https://iphoneduowallpaper.com/api/health && exit 0
            sleep 10
          done
          echo "::error::https://iphoneduowallpaper.com/api/health did not respond after the deploy."
          exit 1
